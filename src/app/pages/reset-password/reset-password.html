<div class="container">
  <mat-card class="card">

    <div class="header">
      <span class="logo">🤝</span>
      <h1>DonaCerca</h1>
      <p>Crea una nueva contraseña</p>
    </div>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nueva contraseña</mat-label>
          <input matInput
                 [type]="hidePassword ? 'password' : 'text'"
                 formControlName="newPassword"
                 placeholder="Mínimo 6 caracteres"/>
          <button mat-icon-button matSuffix type="button"
                  (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>Mínimo 6 caracteres</mat-error>
        </mat-form-field>

        <div class="success-box" *ngIf="successMessage">
          <mat-icon>check_circle</mat-icon>
          <span>{{ successMessage }}</span>
        </div>

        <div class="error-box" *ngIf="errorMessage">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <button mat-raised-button color="primary" type="submit"
                class="full-width submit-btn"
                [disabled]="loading || form.invalid || !token">
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          <span *ngIf="!loading">Restablecer contraseña</span>
        </button>

      </form>
    </mat-card-content>

    <div class="footer">
      <p><a routerLink="/login">← Volver al inicio de sesión</a></p>
    </div>

  </mat-card>
</div>
